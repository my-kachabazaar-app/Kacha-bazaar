name: Build APKs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: customer
            appid: com.kachabazaar.user
            appname: Kacha Bazaar
            url: https://my-kachabazaar-app.github.io/Kacha-bazaar/
            tag: ""
            color: "#12703f"
            splash: 1800
          - key: admin
            appid: com.kachabazaar.admin
            appname: KB Admin
            url: https://my-kachabazaar-app.github.io/Kacha-bazaar/admin.html
            tag: ADMIN
            color: "#c62828"
            splash: 1800
          - key: rider
            appid: com.kachabazaar.rider
            appname: KB PARTNER
            url: https://my-kachabazaar-app.github.io/Kacha-bazaar/rider.html
            tag: ""
            color: "#1565c0"
            splash: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Pick the package name from google-services.json
        run: |
          python3 - <<'PY'
          import json, os
          names = [c["client_info"]["android_client_info"]["package_name"] for c in json.load(open("google-services.json"))["client"]]
          print("Package names in google-services.json:", names)
          want = "${{ matrix.appid }}"
          if want not in names:
              key = "${{ matrix.key }}"
              pick = [n for n in names if n.endswith("." + key)]
              if not pick and key == "customer":
                  pick = [n for n in names if not n.endswith(".admin") and not n.endswith(".rider")]
              if not pick:
                  raise SystemExit("No package name for " + key + " in google-services.json. Add that Android app in Firebase and upload a new google-services.json.")
              want = pick[0]
          print("Using package name:", want)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("APPID=" + want + "\n")
          PY
      - name: Create the Capacitor project
        run: |
          mkdir app
          cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/push-notifications@6 @capacitor/splash-screen@6 @capacitor/app@6
          mkdir www
          echo "<!doctype html><title>${{ matrix.appname }}</title>" > www/index.html
          cat > capacitor.config.json <<JSON
          {
            "appId": "$APPID",
            "appName": "${{ matrix.appname }}",
            "webDir": "www",
            "server": { "url": "${{ matrix.url }}", "androidScheme": "https" },
            "plugins": {
              "SplashScreen": { "launchShowDuration": ${{ matrix.splash }}, "launchAutoHide": true, "backgroundColor": "#FFFFFF", "androidScaleType": "CENTER_INSIDE", "showSpinner": false }
            }
          }
          JSON
          npx cap add android
      - name: Make icons and splash screen from the logo
        run: |
          pip install pillow
          mkdir -p app/assets
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          tag = "${{ matrix.tag }}"
          color = "${{ matrix.color }}"
          logo = Image.open("logo-1024.png").convert("RGBA")
          def put(canvas, size):
              l = logo.resize((size, size), Image.LANCZOS)
              canvas.paste(l, ((canvas.width - size) // 2, (canvas.height - size) // 2), l)
              return canvas
          icon = put(Image.new("RGBA", (1024, 1024), "white"), 940)
          if tag:
              d = ImageDraw.Draw(icon)
              d.rectangle([0, 800, 1024, 1024], fill=color)
              f = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 130)
              w = d.textlength(tag, font=f)
              d.text(((1024 - w) / 2, 830), tag, font=f, fill="white")
          icon.convert("RGB").save("app/assets/icon-only.png")
          put(Image.new("RGBA", (1024, 1024), (0, 0, 0, 0)), 740).save("app/assets/icon-foreground.png")
          Image.new("RGB", (1024, 1024), "white").save("app/assets/icon-background.png")
          for name, bg in (("splash", "#ffffff"), ("splash-dark", "#0f1a13")):
              put(Image.new("RGBA", (2732, 2732), bg), 760).convert("RGB").save("app/assets/" + name + ".png")
          PY
          cd app
          npx @capacitor/assets generate --android
      - name: Add Firebase and build the APK
        run: |
          cd app
          cp ../google-services.json android/app/google-services.json
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import wave, struct, math
          rate = 22050
          w = wave.open("android/app/src/main/res/raw/kb_order.wav", "wb")
          w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
          period = 3.0
          for i in range(int(rate * 24)):
              t = (i / rate) % period
              on = (0 <= t < 0.5) or (0.7 <= t < 1.2)
              v = 0.0
              if on:
                  tt = t if t < 0.5 else t - 0.7
                  f = 1318.0 if int(tt / 0.05) % 2 else 988.0
                  v = 0.95 * math.sin(2 * math.pi * f * (i / rate))
              w.writeframes(struct.pack("<h", int(v * 32000)))
          w.close()
          import glob, os
          p = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)[0]
          pkg = os.environ["APPID"]
          src = """package PKG;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.media.AudioAttributes;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      Uri sound = Uri.parse("android.resource://" + getPackageName() + "/raw/kb_order");
                      AudioAttributes attrs = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIC).build();
                      NotificationChannel ch = new NotificationChannel("kb_order", "New order alerts", NotificationManager.IMPORTANCE_HIGH);
                      ch.setSound(sound, attrs);
                      ch.enableVibration(true);
                      ch.setVibrationPattern(new long[]{0, 800, 400, 800, 400, 800});
                      ch.setLockscreenVisibility(1);
                      nm.createNotificationChannel(ch);
                  }
              }
          }
          """.replace("PKG", pkg)
          open(p, "w").write(src)
          PY
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Rename the APKs
        run: |
          mkdir apk
          cp out/customer-apk/app-debug.apk apk/KachaBazaar-Customer.apk
          cp out/admin-apk/app-debug.apk apk/KachaBazaar-Admin.apk
          cp out/rider-apk/app-debug.apk apk/KachaBazaar-Rider.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APKs build ${{ github.run_number }}
          files: apk/*.apk
