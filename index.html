const ordDate=o=>{if(!(o.createdAt&&o.createdAt.seconds))return "";const d=new Date(o.createdAt.seconds*1000),n=d.getDate(),s=(n%100>10&&n%100<14)||n%10>3?"th":["th","st","nd","rd"][n%10];return `${n}${s} ${d.toLocaleString("en-GB",{month:"short"})} ${d.getFullYear()}, ${d.toLocaleString("en-US",{hour:"2-digit",minute:"2-digit",hour12:true}).toLowerCase()}`};
const stTxt=o=>({pending:["Order placed","w"],assigned:["Rider assigned","w"],accepted:["Rider heading to store","w"],collected:["Out for delivery","w"],arrived:["Rider arrived at your location","w"],delivered:["Order delivered",""],cancelled:["Order cancelled","x"]}[o.status]||["Order placed","w"]);
const thumbs2=o=>`<div class="th2">${o.items.map(i=>{const p=products.find(x=>x.id==i.id);return `<div>${p?img(p):'<span style="font-size:26px">📦</span>'}</div>`}).join("")}</div>`;
function oCard(o){const s=stTxt(o);return `<div class="card oc2"><div class="t row" onclick="openO('${o.id}')"><div><b style="font-size:17px">${s[0]}</b><span class="ok ${s[1]}">${s[1]=="x"?"✕":s[1]=="w"?"•":"✓"}</span><div class="mu s2" style="margin-top:4px">Placed at ${ordDate(o)}</div>${etaLine(o)}</div><span class="row" style="gap:10px"><b style="font-size:18px">₹${o.total}</b><button class="chev">›</button></span></div>${thumbs2(o)}<button class="ag" onclick="reorder('${o.id}')">Order Again</button></div>`}
function myOrdersV(){const L=orders.slice().sort(byTime);return pgHd("Your Orders")+(L.map(oCard).join("")||'<p class="mu">No orders yet.</p>')}
function openO(id){oSel=id;tab="odet";render(true);scrollTo(0,0)}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove&&d.remove(),1800)}
function cp(t){try{navigator.clipboard.writeText("#"+t);toast("Order ID copied")}catch(e){toast("#"+t)}}
function odetV(){const o=orders.find(x=>x.id==oSel);if(!o)return pgHd("Order","","tab='orders';render(true)")+'<p class="mu">Order not found.</p>';
const s=stTxt(o),dn=o.status=="delivered",mins=dn&&o.deliveredAt&&o.deliveredAt.seconds&&o.createdAt&&o.createdAt.seconds?Math.max(1,Math.round((o.deliveredAt.seconds-o.createdAt.seconds)/60)):0,n=o.items.reduce((a,i)=>a+i.q,0);
const row=i=>{const p=products.find(x=>x.id==i.id);return `<div class="ci2">${p?img(p):'<div class="em">📦</div>'}<div style="flex:1"><div>${esc(i.name)}</div><div class="mu s2">${i.q} unit${i.q>1?"s":""}</div></div><div style="text-align:right"><b>₹${i.price*i.q}</b>${p&&p.mrp>i.price?`<div class="mu s2"><s>₹${p.mrp*i.q}</s></div>`:""}</div></div>`};
const mrpT=o.items.reduce((a,i)=>{const p=products.find(x=>x.id==i.id);return a+((p&&p.mrp>i.price?p.mrp:i.price)*i.q)},0),sub=o.sub!=null?o.sub:o.total;
return pgHd(`Order #${oid(o)} <button class="va" onclick="cp('${oid(o)}')">⧉</button>`,`<button class="b l" onclick="tab='help';render(true)">💬 Get Help</button>`,"tab='orders';render(true)",`${n} items`)
+`<div class="card"><div class="ds"><div class="dk">${dn?"✓":"⏳"}</div><div style="flex:1"><b style="font-size:22px">${dn?"Delivered":s[0]}</b></div>${mins?`<div style="text-align:right" class="mu">Arrived in<div class="arr">⚡ ${mins} MINS</div></div>`:(!dn&&etaOf(o)?`<div style="text-align:right" class="mu">Arriving by<div class="arr">⚡ ${etaOf(o).by}</div></div>`:"")}</div></div>`
+`<div class="card"><b>${n} items in order</b>${o.items.map(row).join("")}</div>`
+`<div class="card stack"><b>🧾 Bill Summary</b><div class="row"><span>Item Total</span><span>${mrpT>sub?`<s class="mu">₹${mrpT}</s> `:""}₹${sub}</span></div>${o.fee?`<div class="row"><span>Delivery Fee</span><span>₹${o.fee}</span></div>`:""}${o.tax?`<div class="row"><span>Taxes &amp; Charges (GST)</span><span>₹${o.tax}</span></div>`:""}<div class="row" style="font-size:18px"><b>Total Bill</b><b>₹${o.status=="delivered"&&o.finalTotal!=null?o.finalTotal:o.total}</b></div><button class="b l w" onclick="invoice('${o.id}')">Download Invoice</button></div>`
+`<div class="card stack"><b>Order Details</b><div class="mu s2">Order ID</div><div>#${oid(o)}</div><div class="mu s2">Receiver Details</div><div>${esc(o.name)}, +91 ${esc(o.phone)}</div><div class="mu s2">Delivery Address</div><div>${esc(o.addr)}</div><div class="mu s2">Order Placed at</div><div>${dt(o)}</div>${dn&&o.deliveredAt&&o.deliveredAt.seconds?`<div class="mu s2">Order Arrived at</div><div>${tm2(o.deliveredAt.seconds*1000)}</div>`:""}<div class="mu s2">Payment</div><div>${o.pay=="upi"?"UPI":"Cash on Delivery"}</div></div>`
+`<div class="card row" onclick="tab='help';render(true)"><span>💬 <b>Need help with this order?</b><div class="mu s2">Find your issue or reach out</div></span><span class="mu">›</span></div><div style="height:80px"></div><div class="fixb"><button class="cta" onclick="reorder('${o.id}')">Order Again</button></div>`}
function invoice(id){const o=orders.find(x=>x.id==id),w=window.open("","_blank");if(!w)return alert("Please allow pop-ups to download the invoice.");
w.document.write(`<title>Invoice #${oid(o)}</title><body style="font-family:sans-serif;max-width:560px;margin:20px auto"><h2>${esc(STORE)}</h2><p>Invoice #${oid(o)}<br>${dt(o)}<br>${esc(o.name)}, ${esc(o.phone)}<br>${esc(o.addr)}</p><table width="100%" cellpadding="6" style="border-collapse:collapse">${o.items.map(i=>`<tr style="border-bottom:1px solid #ddd"><td>${esc(i.name)} × ${i.q}</td><td align="right">₹${i.price*i.q}</td></tr>`).join("")}</table><p align="right">Items ₹${o.sub!=null?o.sub:o.total}<br>Delivery ₹${o.fee||0}<br>GST ₹${o.tax||0}<br><b>Total ₹${o.total}</b><br>Payment: ${o.pay.toUpperCase()}</p><script>window.print()<\/script></body>`);w.document.close()}
function editV(){return pgHd("Edit Profile","","tab='prof';render(true)")+`<div class="card stack"><div class="fld"><label>Name <b style="color:#e67e22">*</b></label><input id="en" value="${esc(me.name)}"></div><div class="pin ro"><span>+91</span><input value="${esc(me.phone)}" disabled></div><div class="pin ro"><span>✉️</span><input value="${esc(me.email||"")}" disabled></div><div class="mu s2">Your phone number and email are used to log in, so they can't be changed here.</div><button class="cta" style="margin-top:0" onclick="saveP()">Submit</button></div><div style="border-top:2px dashed var(--bd);margin:18px 0"></div><button class="va" style="color:#e53935;font-size:18px" onclick="delAcc()">🗑 Delete Account</button><p class="mu">By proceeding with the account deletion, you agree that all your data associated with the account cannot be retrieved by you. Please refer to our privacy policy for more information on the data deletion.</p>`}
async function saveP(){const n=$("#en").value.trim();if(!n)return alert("Please enter your name");try{await db.collection("users").doc(me.uid).update({name:n});me.name=n;toast("Profile updated");tab="prof";render(true)}catch(e){alert(e.message)}}
async function delAcc(){if(!confirm("Delete your account permanently? This cannot be undone."))return;const p=prompt("Enter your 4-digit password to confirm");if(p===null)return;
try{const u=auth.currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,pw(p)));const ph=me.phone,em=me.email||u.email;await db.collection("lookup").doc(ph).delete();await db.collection("lookup").doc(em).delete();await db.collection("users").doc(u.uid).delete();await u.delete();toast("Account deleted")}catch(e){alert(e.code=="auth/wrong-password"||e.code=="auth/invalid-credential"?"Wrong password":e.message)}}
function reorder(id){const o=orders.find(x=>x.id==id);o.items.forEach(i=>{const p=products.find(x=>x.id==i.id);if(p&&p.stock>0)cart[i.id]=Math.min(p.stock,(cart[i.id]||0)+i.q)});tab="cart";render(true)}

function swap(a,html){const k={};a.querySelectorAll("input[id]").forEach(e=>{if(e.type!="password")k[e.id]=e.value});a.innerHTML=html;Object.keys(k).forEach(i=>{const e=document.getElementById(i);if(e&&k[i]!==""&&e.type!="checkbox")e.value=k[i]})}
function render(force){
const a=$("#app"),nav=$("#nav");$("#hbg").style.display="none";$("#top").className="";
const key=[tab,lst,oSel,showAuth,scr,!!me].join();if(key!=lastKey){lastKey=key;a.className="";void a.offsetWidth;a.className="go"}
if(showAuth&&!me){nav.innerHTML="";$("#top").innerHTML="";return swap(a,authV())}
const fullPg=["orders","odet","editp","cart","checkout"].includes(tab);$("#top").innerHTML=fullPg?"":hdr();$("#top").className=tab=="home"?"h":"";$("#hbg").style.display=tab=="home"?"block":"none";
const N=[["home","🏠","Home"],["cat","▦","Category"],["cart","🛒","Cart"],["orders","🛍","Order"],["help","❓","Help"]];
nav.innerHTML=N.map(t=>`<button class="${tab==t[0]?"on":""}" onclick="tab='${t[0]}';render(true);scrollTo(0,0)"><span>${t[1]}${t[0]=="cart"&&cnt()?`<i>${cnt()}</i>`:""}</span>${t[2]}</button>`).join("");
swap(a,tab=="cat"?catV():tab=="cart"?cartV():tab=="odet"?odetV():tab=="editp"?(me?editV():homeV()):tab=="checkout"?(me?checkoutV():cartV()):tab=="wish"?wishV():tab=="orders"?(me?myOrdersV():loginP("see your orders")):tab=="help"?helpV():tab=="list"?listV():tab=="prof"?(me?profV():homeV()):homeV())}
</script>
</body>
</html>
