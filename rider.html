function docV(){const b=me.bank;
return `<div class="rh row"><b>Documents</b></div>`+KY.map(k=>`<div class="card"><b>${k[1]}</b>${kimg[k[0]]?`<img src="${esc(kimg[k[0]])}" style="width:100%;height:auto;border-radius:8px;margin-top:6px">`:'<div class="mu s2">Not uploaded</div>'}</div>`).join("")+'<h2>Bank details</h2>'+(b&&!editB?`<div class="card stack"><div>${esc(b.name)}</div><div class="mu">A/C ${esc(b.acc)}<br>${esc(b.bank)} · ${esc(b.ifsc)}</div><button class="b l w" onclick="editB=true;render(true)">Change bank details</button></div>`:`<div class="card stack"><input id="bn" placeholder="Account holder name" value="${esc(b?b.name:"")}"><input id="ba" placeholder="Account number" value="${esc(b?b.acc:"")}"><input id="bk" placeholder="Bank name" value="${esc(b?b.bank:"")}"><input id="bi" placeholder="IFSC code" value="${esc(b?b.ifsc:"")}"><button class="b w" onclick="saveBank()">Submit</button></div>`)}
async function saveBank(){const b={name:$("#bn").value.trim(),acc:$("#ba").value.trim(),bank:$("#bk").value.trim(),ifsc:$("#bi").value.trim().toUpperCase()};if(!b.name||!b.acc||!b.bank||!b.ifsc)return alert("Fill in all bank details");
try{await db.collection("users").doc(me.uid).update({bank:b});me.bank=b;editB=false;render(true)}catch(e){alert(e.message)}}
const aboutV=()=>`<div class="rh row"><b>About</b></div><div class="card pl"><div class="pi" onclick="openPdf('terms')"><span>📄</span><div>Terms &amp; Conditions</div><span class="mu">›</span></div><div class="pi" onclick="openPdf('privacy')"><span>🔒</span><div>Privacy Policy</div><span class="mu">›</span></div></div>`;
async function openPdf(k){try{const d=await db.collection("files").doc(k).get();if(!d.exists||!d.data().url)return alert("Not uploaded yet.");window.open(d.data().url,"_blank")}catch(e){alert(e.message)}}
/* ---- help & support ---- */
const tg2=t=>`<span class="tag ${t.status=="closed"?"":"s-delivered"}">${t.status=="closed"?"Closed":"Active"}</span>`;
function helpV(){const t=tickets.find(x=>x.id==tk);
if(t)return `<div class="rh row"><b>${esc(t.subject)}</b></div>${tg2(t)}`+t.msgs.map(m=>`<div class="card"><div class="mu s2">${m.from=="admin"?"Store captain":"You"} · ${tm(m.at)}</div>${esc(m.text)}</div>`).join("")+`<input id="tr" placeholder="Write a reply"><button class="b w" onclick="rep('${t.id}')">Send reply</button>`;
const L=tickets.slice().sort(byTime);
return `<div class="rh row"><b>Help &amp; Support</b></div><h2>Past Tickets</h2>`+(L.map(x=>`<div class="card row" onclick="tk='${x.id}';render(true)"><span>${esc(x.subject)}</span>${tg2(x)}</div>`).join("")||'<p class="mu">No tickets yet.</p>')+`<h2>Store Captain</h2><div class="card row"><b>👤 ${esc(cfg.mgrName||"Store captain")}</b>${cfg.mgrPhone?`<a class="b" href="tel:${esc(cfg.mgrPhone)}">📞 ${esc(cfg.mgrPhone)}</a>`:'<span class="mu">Not set</span>'}</div><div style="height:90px"></div><button class="rtk" onclick="raise()">🎫 Raise a Ticket</button>`}
function raise(){pop(`<h2>Raise a ticket</h2><input id="ts" placeholder="Describe your problem"><button class="b w" onclick="newTk()">Submit ticket</button>`)}
function newTk(){const s=$("#ts").value.trim();if(!s)return alert("Describe your problem");hidePop();db.collection("tickets").add({riderId:me.uid,riderName:me.name,riderCode:me.riderCode||"",subject:s,status:"open",msgs:[{from:"rider",text:s,at:Date.now()}],createdAt:TS()}).catch(e=>alert(e.message))}
function rep(id){const x=$("#tr").value.trim();if(!x)return;db.collection("tickets").doc(id).update({msgs:firebase.firestore.FieldValue.arrayUnion({from:"rider",text:x,at:Date.now()}),status:"open"}).then(()=>{$("#tr").value=""}).catch(e=>alert(e.message))}
function swap(a,html){const k={};a.querySelectorAll("input[id]").forEach(e=>{if(e.type!="password")k[e.id]=e.value});a.innerHTML=html;Object.keys(k).forEach(i=>{const e=document.getElementById(i);if(e&&k[i]!==""&&e.type!="checkbox")e.value=k[i]})}
const SUBS={job:jobV,login:loginV,done:doneV,odet:odetV,earn1:()=>dayV(dkey(Date.now())),day:()=>dayV(selD),ret:retV,cod:codV};
function render(force){const a=$("#app"),nav=$("#nav");$("#top").innerHTML="";
const key=[tab,sub,selO,selD,tk,scr,!!me].join("|");if(key!==pgKey){pgKey=key;a.className="";void a.offsetWidth;a.className="pg-"+pgDir;pgDir="t"}
const home=!!me&&scr=="main"&&tab=="home"&&!sub;
$("#rbg").style.display=home?"block":"none";document.body.className=(me&&scr=="main"&&tab=="prof"&&!sub)?"pf":"";
if(!me){nav.style.display="none";return swap(a,authV())}
if(scr!="main"){nav.style.display="none";return swap(a,gateV())}
nav.style.display="";
const N=[["home","🏠","Home"],["earn","💰","Earning"],["refer","🎁","Refer &amp; Earn"],["prof","👤","Profile"]];
nav.innerHTML=N.map(t=>`<button class="${tab==t[0]?"on":""}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("");
const sp=sub&&SUBS[sub]&&!(tab=="prof"&&["rate","hist","help","cash","doc","about","me"].includes(sub));
swap(a,sp?SUBS[sub]():tab=="home"?homeV():tab=="earn"?earnV():tab=="refer"?referV():profV());
if(tab=="home"&&!sub)bnInit();if(sub=="job")slInit();if(force)pushNav()}
if(document.addEventListener)document.addEventListener("pointerdown",function(e){try{var t=e.target.closest&&e.target.closest(".b,.cta,.sd,.vd,.mi,.nav2");if(!t||t.closest(".sl"))return;var r=t.getBoundingClientRect(),s=Math.max(r.width,r.height)*1.3,d=document.createElement("span");d.className="rip";d.style.cssText="width:"+s+"px;height:"+s+"px;left:"+(e.clientX-r.left-s/2)+"px;top:"+(e.clientY-r.top-s/2)+"px";if(getComputedStyle(t).position=="static")t.style.position="relative";t.style.overflow="hidden";t.appendChild(d);setTimeout(function(){d.remove&&d.remove()},600)}catch(x){}},{passive:true});
setTimeout(()=>{const s=document.getElementById("spl");if(s){s.style.opacity=0;setTimeout(()=>{s.remove&&s.remove()},700)}},2600);
</script>
