function dashV(){
const T=orders.filter(o=>secs(o)>=today0()),rev=T.reduce((n,o)=>n+o.total,0),pend=orders.filter(o=>o.status=="pending"),act=orders.filter(o=>ACTIVE.includes(o.status)),dn=orders.filter(o=>o.status=="delivered"),low=products.filter(p=>p.stock<=5);
const S=(t,v,c)=>`<div class="card"><div class="mu s2">${t}</div><b style="font-size:22px;${c||""}">${v}</b></div>`;
const rf=riders.filter(free).length,rb=riders.filter(busy).length;
return `<div class="kg">${S("Today's Orders",T.length)}${S("Today's Sales","₹"+rev)}${S("Pending",pend.length,pend.length?"color:#d9480f":"")}${S("On the way",act.length)}${S("Delivered (all)",dn.length)}${S("Low stock (≤5)",low.length,low.length?"color:#d9480f":"")}</div>
<div class="card stack"><b>Riders</b><div class="row"><span>Available</span><b>${rf}</b></div><div class="row"><span>Busy</span><b>${rb}</b></div><div class="row"><span>Offline</span><b>${riders.length-rf-rb}</b></div></div>`
+(pend.length?`<div class="card stack"><b>Needs a rider</b>${pend.slice(0,5).map(o=>`<div class="row"><span>#${oid(o)} · ${esc(o.name)}</span><b>₹${o.total}</b></div>`).join("")}<button class="b w" onclick="ofl='pending';tab='orders';render(true)">Open orders</button></div>`:"")
+(low.length?`<div class="card stack"><b>Low stock</b>${low.slice(0,8).map(p=>`<div class="row"><span>${esc(p.name)}</span><b>${p.stock}</b></div>`).join("")}</div>`:"")}
function aCard(o){
let h=`<div class="card stack"><div class="row"><b>#${oid(o)} · ${esc(o.name)}</b>${badge(o)}</div><div class="mu s2">${dt(o)}</div><div>${itemsT(o)}</div><div class="row"><span>₹${o.total} · ${o.pay=="upi"?"UPI":"COD"}</span>${o.pay=="upi"?`<button class="chip ${o.paid?"on":""}" onclick="paid('${o.id}',${!o.paid})">${o.paid?"Payment verified ✓":"Verify UTR "+esc(o.utr)}</button>`:""}</div><div class="mu">📍 ${esc(o.addr)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></div>`;
if(o.status=="pending")h+=`<select id="r${o.id}">${riders.map(r=>`<option value="${r.id}" ${free(r)?"":"disabled"}>${esc(r.name)} (${free(r)?"Available":busy(r)?"Busy":"Offline"})</option>`).join("")||"<option>No riders</option>"}</select><button class="b w" onclick="assign('${o.id}')">Assign rider</button>`;
else h+=`<div class="mu">Rider: ${esc(o.riderName)}</div>`;
return h+"</div>"}
function ordList(){const k=aq.trim().toLowerCase();return orders.slice().sort(byTime).filter(o=>(ofl=="all"||o.status==ofl)&&(!k||(oid(o)+o.name+o.phone).toLowerCase().includes(k))).map(aCard).join("")||'<p class="mu">No orders.</p>'}
function paid(id,v){db.collection("orders").doc(id).update({paid:v}).catch(e=>alert(e.message))}
const prodForm=()=>`<div class="card stack"><input id="pn" placeholder="Product name"><input id="pp" type="number" placeholder="Price ₹"><input id="ps" type="number" placeholder="Stock"><input id="pi" placeholder="Emoji or image link (optional)"><button class="b l w" onclick="pickP()">📷 Choose photo <span id="pph"></span></button><select id="pc">${CATS.map(c=>`<option>${esc(c[0])}</option>`).join("")}</select><input id="pm" type="number" placeholder="Old price (MRP) ₹, optional">${SECS.map((x,i)=>`<label class="mu"><input id="sf${i}" type="checkbox" style="width:auto"> ${x[1]}</label>`).join("<br>")}<button class="b w" onclick="addP()">Add</button></div>`;
function prodList(){const k=aq.trim().toLowerCase();return products.filter(p=>!k||p.name.toLowerCase().includes(k)).map(p=>`<div class="card stack"><div class="ci">${img(p)}<div style="flex:1"><b>${esc(p.name)}</b><div class="mu s2">₹${p.price}${p.mrp>p.price?" (MRP ₹"+p.mrp+")":""} · Stock ${p.stock}</div><select onchange="setCatP('${p.id}',this.value)"><option value="">Category…</option>${CATS.map(c=>`<option ${p.cat==c[0]?"selected":""}>${esc(c[0])}</option>`).join("")}</select></div></div><div>${SECS.map(x=>`<button class="chip ${inSec(p,x[0])?"on":""}" onclick="tg('${p.id}','${x[0]}')">${x[1]}</button>`).join("")}</div><div class="row"><button class="b l" onclick="editProd('${p.id}')">✏️ Edit</button><button class="b l" onclick="setPimg('${p.id}')">Photo</button><button class="b l" onclick="stk('${p.id}')">Stock</button><button class="b l" onclick="delP('${p.id}')">Delete</button></div></div>`).join("")||'<p class="mu">No products.</p>'}
function editProd(id){const p=products.find(x=>x.id==id),n=prompt("Name",p.name);if(n===null)return;const pr=prompt("Price ₹",p.price);if(pr===null)return;const m=prompt("Old price (MRP) ₹, 0 = none",p.mrp||0);if(m===null)return;db.collection("products").doc(id).update({name:n.trim()||p.name,price:+pr||p.price,mrp:+m||0}).catch(e=>alert(e.message))}
function setCatP(id,v){if(v)db.collection("products").doc(id).update({cat:v}).catch(e=>alert(e.message))}
function ridV(){return riders.map(r=>{const m=orders.filter(o=>o.riderId==r.id),a=m.filter(o=>ACTIVE.includes(o.status)).length,d=m.filter(o=>o.status=="delivered").length,cod=m.filter(o=>o.status=="delivered"&&o.pay=="cod").reduce((s,o)=>s+o.total,0),dep=deps.filter(x=>x.riderId==r.id).reduce((s,x)=>s+(+x.amount||0),0),st=r.approved?(!r.available?"Offline":busy(r)?"Busy":"Online"):(r.kyc=="submitted"?"KYC submitted":"Documents pending");
return `<div class="card stack"><div class="row"><b>${esc(r.name)} <span class="mu s2">${esc(r.riderCode||"")}</span></b><span class="tag">${st}</span></div><div class="mu"><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a> · Active ${a} · Delivered ${d}${r.approved?` · Cash held ₹${Math.max(0,cod-dep)}`:""}</div><div class="row"><button class="b l" style="flex:1" onclick="viewKyc('${r.id}')">Documents</button>`+(r.approved?`<button class="b l" style="flex:1" onclick="deposit('${r.id}')">Record deposit</button><button class="b l" style="flex:1" onclick="appr('${r.id}',false)">Revoke</button>`:`<button class="b" style="flex:1" onclick="approve('${r.id}')">Approve</button>`)+`</div></div>`}).join("")||'<p class="mu">No riders yet.</p>'}
function appr(id,v){db.collection("users").doc(id).update({approved:v}).catch(e=>alert(e.message))}
const setV=()=>`<div class="card stack"><b>Store settings</b><label class="mu">Delivery fee ₹</label><input id="st_fee" type="number" value="${DELIVERY_FEE}"><label class="mu">GST / tax %</label><input id="st_tax" type="number" value="${TAX_PCT}"><label class="mu">UPI ID (for payments)</label><input id="st_upi" value="${esc(UPI_ID)}"><label class="mu">Support phone</label><input id="st_ph" type="tel" value="${esc(SUPPORT_PHONE)}"><label class="mu">Support email</label><input id="st_em" type="email" value="${esc(SUPPORT_EMAIL)}"><button class="b w" onclick="saveSet()">Save settings</button></div>`;
async function saveSet(){const c={deliveryFee:+$("#st_fee").value||0,taxPct:+$("#st_tax").value||0,upiId:$("#st_upi").value.trim(),supportPhone:$("#st_ph").value.trim(),supportEmail:$("#st_em").value.trim()};try{await db.collection("settings").doc("store").set(c);alert("Saved")}catch(e){alert(e.message)}}
function aS(v){aq=v;$("#ares").innerHTML=tab=="orders"?ordList():prodList()}
function adminV(){
if(tab=="rset")return rsetV();if(tab=="tix")return tixV();if(tab=="dash")return dashV();
if(tab=="riders")return ridV();
if(tab=="set")return setV();
if(tab=="cats")return CATS.map((c,i)=>`<div class="card row"><span class="row" style="gap:10px;justify-content:flex-start"><span class="ct s" style="background:${c[2]}">${catPic(i)}</span>${esc(c[0])}</span><span><button class="b l" onclick="setCat(${i})">Image</button>${catImg["c"+i]?` <button class="b l" onclick="clrCat(${i})">Reset</button>`:""}</span></div>`).join("");
if(tab=="products")return `<button class="b w" onclick="addOpen=!addOpen;render(true)">${addOpen?"Close":"+ Add product"}</button>`+(addOpen?prodForm():"")+`<input id="aq" class="srch" placeholder="Search products" value="${esc(aq)}" oninput="aS(this.value)" style="margin-top:10px"><div id="ares">${prodList()}</div>`;
return `<div class="hs">${OF.map(f=>`<button class="chip ${ofl==f[0]?"on":""}" onclick="ofl='${f[0]}';render(true)">${f[1]} ${f[0]=="all"?orders.length:orders.filter(o=>o.status==f[0]).length}</button>`).join("")}</div><input id="aq" class="srch" placeholder="Search order no., name or phone" value="${esc(aq)}" oninput="aS(this.value)"><div id="ares">${ordList()}</div>`}
async function assign(id){const rid=$("#r"+id).value,r=riders.find(x=>x.id==rid);if(!r||!free(r))return alert("No available rider");
try{await db.collection("orders").doc(id).update({riderId:r.id,riderName:r.name,status:"assigned",assignedAt:TS()})}catch(e){alert(e.message)}}
async function addP(){const n=$("#pn").value.trim(),p=+$("#pp").value,s=+$("#ps").value,m=+$("#pm").value||0;if(!n||!p||s<0)return alert("Enter name, price and stock");
try{await db.collection("products").add({name:n,price:p,mrp:m,stock:s,img:pPhoto||$("#pi").value.trim(),cat:$("#pc").value,sec:SECS.filter((x,i)=>$("#sf"+i).checked).map(x=>x[0])});["#pn","#pp","#ps","#pi","#pm"].forEach(x=>$(x).value="");SECS.forEach((x,i)=>$("#sf"+i).checked=false);pPhoto="";addOpen=false;render(true)}catch(e){alert(e.message)}}
async function stk(id){const v=prompt("New stock quantity");if(v===null||isNaN(+v))return;db.collection("products").doc(id).update({stock:+v})}
function tg(id,k){const p=products.find(x=>x.id==id),F=firebase.firestore.FieldValue,on=inSec(p,k),u={sec:on?F.arrayRemove(k):F.arrayUnion(k)};if(k=="featured"&&on)u.featured=false;db.collection("products").doc(id).update(u).catch(e=>alert(e.message))}
function pickImg(max,cb){const f=document.createElement("input");f.type="file";f.accept="image/*";f.onchange=()=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas"),x=c.getContext("2d");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.75))};im.src=r.result};r.readAsDataURL(f.files[0])};f.click()}
function pickP(){pickImg(360,d=>{pPhoto=d;$("#pph").textContent="✓"})}
function setPimg(id){pickImg(360,d=>db.collection("products").doc(id).update({img:d}).catch(e=>alert(e.message)))}
function setCat(i){pickImg(400,d=>db.collection("categories").doc("c"+i).set({img:d}).catch(e=>alert(e.message)))}
function clrCat(i){db.collection("categories").doc("c"+i).delete()}
function delP(id){if(confirm("Delete this product?"))db.collection("products").doc(id).delete()}

var cfgR={},deps=[],tickets=[],tkA="";
async function approve(id){const r=riders.find(x=>x.id==id);if(r.kyc!="submitted"&&!confirm("This rider has not submitted documents. Approve anyway?"))return;
try{await db.runTransaction(async t=>{const cr=db.collection("counters").doc("rider"),c=await t.get(cr),n=(c.exists?c.data().n:0)+1;t.set(cr,{n});t.update(db.collection("users").doc(id),{approved:true,riderCode:r.riderCode||"KOL_KB_"+String(n).padStart(4,"0")})})}catch(e){alert(e.message)}}
async function viewKyc(id){try{const s=await db.collection("users").doc(id).collection("kyc").get(),r=riders.find(x=>x.id==id);let h=`<h2>${esc(r.name)}</h2>`;s.forEach(d=>{h+=`<div class="card"><b>${esc(d.id)}</b><img src="${d.data().img}" style="width:100%;height:auto;border-radius:8px"></div>`});if(!s.size)h+='<p class="mu">No documents uploaded.</p>';const b=r.bank;if(b)h+=`<div class="card"><b>Bank details</b><div class="mu">${esc(b.name)}<br>A/C ${esc(b.acc)}<br>${esc(b.bank)} · ${esc(b.ifsc)}</div></div>`;pop(h)}catch(e){alert(e.message)}}
function deposit(id){const v=prompt("Cash deposited by rider (₹)");if(!v||isNaN(+v)||+v<=0)return;db.collection("deposits").add({riderId:id,amount:+v,at:Date.now()}).catch(e=>alert(e.message))}
function rsetV(){const c=cfgR;return `<div class="card stack"><b>Rider pay &amp; surge</b><input id="rp" type="number" placeholder="Pay per delivered order (₹)" value="${c.pay||""}"><input id="rs1" type="number" placeholder="Surge amount per order (₹)" value="${c.surge||""}"><label class="mu"><input id="rs2" type="checkbox" style="width:auto" ${c.surgeOn?"checked":""}> Surge active</label><input id="rr" type="number" placeholder="Rain surge per order (₹)" value="${c.rain||""}"><label class="mu"><input id="rr2" type="checkbox" style="width:auto" ${c.rainOn?"checked":""}> Rain surge active</label><input id="rn" placeholder="Rate card note (optional)" value="${esc(c.note||"")}"></div><div class="card stack"><b>Store &amp; manager</b><input id="rm" placeholder="Google Maps link of your store" value="${esc(c.mapUrl||"")}"><input id="rg" placeholder="Store manager name" value="${esc(c.mgrName||"")}"><input id="rh" type="tel" placeholder="Store manager phone" value="${esc(c.mgrPhone||"")}"></div><button class="b w" onclick="saveR()">Save</button><div class="card stack"><b>About documents (PDF, max 700 KB)</b><button class="b l w" onclick="upPdf('terms')">Upload Terms &amp; Conditions</button><button class="b l w" onclick="upPdf('privacy')">Upload Privacy Policy</button></div>`}
function saveR(){db.collection("settings").doc("rider").set({pay:+$("#rp").value||0,surge:+$("#rs1").value||0,surgeOn:$("#rs2").checked,rain:+$("#rr").value||0,rainOn:$("#rr2").checked,note:$("#rn").value.trim(),mapUrl:$("#rm").value.trim(),mgrName:$("#rg").value.trim(),mgrPhone:$("#rh").value.trim()}).then(()=>alert("Saved")).catch(e=>alert(e.message))}
function upPdf(k){const f=document.createElement("input");f.type="file";f.accept="application/pdf";f.onchange=()=>{const x=f.files[0];if(x.size>700000)return alert("PDF is too large (max 700 KB).");const r=new FileReader();r.onload=()=>db.collection("files").doc(k).set({name:x.name,data:r.result}).then(()=>alert("Uploaded")).catch(e=>alert(e.message));r.readAsDataURL(x)};f.click()}
const tg2=t=>`<span class="tag ${t.status=="closed"?"":"s-delivered"}">${t.status=="closed"?"Closed":"Active"}</span>`;
const tm=m=>new Date(m).toLocaleString([],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
function tixV(){const t=tickets.find(x=>x.id==tkA);
if(t)return `<button class="b l" onclick="tkA='';render(true)">← Back</button><h2>${esc(t.subject)}</h2><div class="mu">${esc(t.riderName)} · ${esc(t.riderCode)} ${tg2(t)}</div>`+t.msgs.map(m=>`<div class="card"><div class="mu s2">${m.from=="admin"?"You":esc(t.riderName)} · ${tm(m.at)}</div>${esc(m.text)}</div>`).join("")+`<input id="ar" placeholder="Write a reply"><button class="b w" onclick="arep('${t.id}')">Send reply</button><button class="b l w" onclick="tset('${t.id}','${t.status=="closed"?"open":"closed"}')">${t.status=="closed"?"Reopen ticket":"Close ticket"}</button>`;
return tickets.slice().sort(byTime).map(t=>`<div class="card row" onclick="tkA='${t.id}';render(true)"><span><b>${esc(t.subject)}</b><div class="mu s2">${esc(t.riderName)} · ${esc(t.riderCode)}</div></span>${tg2(t)}</div>`).join("")||'<p class="mu">No tickets.</p>'}
function arep(id){const x=$("#ar").value.trim();if(!x)return;db.collection("tickets").doc(id).update({msgs:firebase.firestore.FieldValue.arrayUnion({from:"admin",text:x,at:Date.now()})}).then(()=>{$("#ar").value=""}).catch(e=>alert(e.message))}
function tset(id,s){db.collection("tickets").doc(id).update({status:s}).catch(e=>alert(e.message))}
function pop(h){let p=document.getElementById("pop");if(!p){p=document.createElement("div");p.id="pop";document.body.appendChild(p)}p.innerHTML=`<div class="pb2" onclick="if(event.target==this)this.parentNode.style.display='none'"><div class="pc2">${h}<button class="b w" onclick="document.getElementById('pop').style.display='none'">Close</button></div></div>`;p.style.display="block"}
function swap(a,html){const k={};a.querySelectorAll("input[id]").forEach(e=>{if(e.type!="password")k[e.id]=e.value});a.innerHTML=html;Object.keys(k).forEach(i=>{const e=document.getElementById(i);if(e&&k[i]!==""&&e.type!="checkbox")e.value=k[i]})}
function render(force){
const a=$("#app"),top=$("#top");
if(!me){top.innerHTML=`<div class="row"><b class="logo">${LOGO}</b><span class="tag">ADMIN</span></div>`;return swap(a,authV())}
const tabs=[["dash","Dashboard"],["orders","Orders"],["products","Products"],["cats","Categories"],["riders","Riders"],["tix","Tickets"],["rset","Rider setup"],["set","Settings"]];
top.innerHTML=`<div class="row"><b class="logo">${LOGO}</b><span class="mu">${esc(me.name)} <button class="b l" onclick="auth.signOut()">Logout</button></span></div><div class="tabs">${tabs.map(t=>`<button class="${tab==t[0]?"on":""}" onclick="aq='';tab='${t[0]}';render(true)">${t[1]}</button>`).join("")}</div>`;
swap(a,adminV())}
</script>
</body>
</html>
